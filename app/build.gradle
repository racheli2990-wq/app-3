plugins {
    id 'com.android.application'
}
android {
    namespace 'com.racheli.offlinenotes'
    compileSdk 36
    defaultConfig {
        applicationId 'com.racheli.offlinenotes'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.18.0'
}
